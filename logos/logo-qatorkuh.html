<style>
/* Layout: hero stacked lockup on white, then horizontal lockups on white/green/dark, app icons and favicon sizes */
:root{--bg:#f3f5f2;--ink:#14201a;--muted:#6b7870;--line:#e3e8e4}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1512;--ink:#eef3ef;--muted:#9aa89f;--line:#26332c;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1512;--ink:#eef3ef;--muted:#9aa89f;--line:#26332c;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Manrope",system-ui,sans-serif;padding-block:22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font-size:23px;margin:0;font-weight:800}h2{margin:0;font-size:16px;font-weight:800}
p{margin:0;color:var(--muted);font-weight:500;line-height:1.45}
.board{border-radius:24px;display:flex;align-items:center;justify-content:center;padding:36px 16px;min-width:0}
.white{background:#fff;color:#0d2a20;border:1px solid var(--line)}
.green{background:linear-gradient(145deg,#075c40,#17a46c);color:#fff;--sun:#ffd978}
.dark{background:#0c1713;color:#fff;--sun:#ffd978}
.stack{display:flex;flex-direction:column;align-items:center;gap:10px}
.stack svg{width:min(46vw,180px);height:auto;aspect-ratio:1}
.wm{font-weight:800;letter-spacing:-.04em;line-height:1;white-space:nowrap}
.wm i{font-style:normal;color:#13a56d}
.green .wm i,.dark .wm i{color:#8ff0bb}
.big{font-size:clamp(34px,10vw,52px)}
.tag{font-size:11.5px;font-weight:700;letter-spacing:.32em;text-transform:uppercase;color:#6b7870;margin-right:-.32em}
.green .tag,.dark .tag{color:rgba(255,255,255,.75)}
.hz{display:flex;align-items:center;gap:12px}.hz svg{width:62px;height:62px;flex:none}.hz .wm{font-size:34px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.icons{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end}
.ic{width:96px;height:96px;border-radius:25px;display:grid;place-items:center}.ic svg{width:64px;height:64px}
.i1{background:linear-gradient(145deg,#075c40,#17a46c);--sun:#ffd978}
.i2{background:#fff;border:1px solid var(--line)}
.i3{background:#0c1713;--sun:#ffd978}
.fav{display:flex;gap:16px;align-items:flex-end}.fav div{display:grid;place-items:center;background:#fff;border:1px solid var(--line);border-radius:8px;padding:6px}
.sec{display:flex;flex-direction:column;gap:10px}
</style>

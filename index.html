<title>Китобхона прототипи</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400&display=swap&subset=cyrillic">
<style>
/* Layout: white phone app, rounded soft-grey cards, orange accent, 5-tab bottom bar (Mutolaa-style structure, Tajik copy) */
:root{
  --orange:#13a56d; --orange-2:#63d48f; --orange-3:#0b7d57; --orange-soft:#e1f6ea;
  --bg:#ffffff; --card:#f6f6f4; --ink:#1c1b19; --muted:#8a8782; --line:#ececE8; --skel:#ededeb;
  --indigo:#4a4fb5; --indigo-2:#8a8fe0;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="paper"]){
  --orange-soft:#12302a; --bg:#131211; --card:#1f1d1b; --ink:#f2efe9; --muted:#9a968f; --line:#2a2826; --skel:#26241f; color-scheme:dark}}
:root[data-theme="dark"]{
  --orange-soft:#12302a; --bg:#131211; --card:#1f1d1b; --ink:#f2efe9; --muted:#9a968f; --line:#2a2826; --skel:#26241f; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
h1,h2,h3,p{margin:0}
.app{max-width:460px;margin:0 auto;min-height:100%;background:var(--bg)}
.pad{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:20px}
.screen>:first-child{padding-top:14px}
.ico{width:24px;height:24px;flex:none}
.round{width:46px;height:46px;border-radius:50%;background:var(--card);border:0;display:grid;place-items:center;flex:none}
.round .ico{width:21px;height:21px}

/* top bar */
.top{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:6px;flex:1;min-width:0;font-size:22px;font-weight:800;letter-spacing:-.5px}
.brand svg{width:40px;height:40px;flex:none}
.brand em{font-style:normal;color:var(--orange)}
.ringmini{width:46px;height:46px;position:relative;flex:none}
.ringmini svg{width:100%;height:100%}
.ringmini b{position:absolute;inset:0;display:grid;place-items:center;font-size:15px}

/* premium banner */
.promo{position:relative;overflow:hidden;border-radius:24px;padding:18px;color:#fff;background:linear-gradient(120deg,var(--orange-3),var(--orange-2));min-height:150px;display:flex;flex-direction:column;gap:6px}
.promo h2{font-size:21px;font-weight:800}
.promo p{font-size:14px;font-weight:600;max-width:20ch;line-height:1.3}
.promo .cta{margin-top:10px;align-self:flex-start;background:#fff;color:var(--orange-3);border:0;border-radius:24px;height:42px;padding:0 16px;font-weight:700;display:flex;align-items:center;gap:10px}
.promo .art{position:absolute;right:-20px;top:30px;width:130px;height:120px;opacity:.9}
.promo h2{max-width:70%}

/* continue */
.cont{display:flex;gap:14px;align-items:flex-start}
.cont .cover{width:84px}
.cont h3{font-size:20px;font-weight:800;line-height:1.15}
.cont .by{color:var(--muted);font-weight:600;font-size:14px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:5px;background:var(--line);border-radius:3px;margin:8px 0}
.pbar i{display:block;height:100%;background:var(--orange);border-radius:3px}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:20px;background:var(--card);border:0;font-weight:800}
.pill small{color:var(--muted);font-weight:700;font-size:inherit}
.cont>div{min-width:0;flex:1}

/* chips */
.chips{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:44px;padding:0 20px;border-radius:14px;border:0;background:var(--card);font-weight:700;font-size:14.5px}
.chip.on{background:var(--orange);color:#fff}

.sec{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline}
.sec-h h2{font-size:22px;font-weight:800}
.sec-h button{background:none;border:0;color:var(--orange);font-weight:700}
.shelf{display:flex;gap:14px;overflow-x:auto;scrollbar-width:none;margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)));padding-bottom:4px}
.shelf::-webkit-scrollbar{display:none}
.book{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:8px;min-width:0}
.shelf .book{width:158px;flex:none}
.book .t{font-weight:800;font-size:14.5px;line-height:1.25}
.book .a{color:var(--muted);font-weight:600;font-size:12.5px;margin-top:-5px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 14px}

/* covers */
.cover{container-type:inline-size;aspect-ratio:2/3;max-width:100%;border-radius:10px;position:relative;overflow:hidden;color:#fff;box-shadow:0 6px 16px rgba(0,0,0,.3),inset 3px 0 0 rgba(255,255,255,.12)}
.cover svg:first-child{position:absolute;inset:0;width:100%;height:100%;display:block}
.cover::after{content:"";position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14);pointer-events:none}
.cv-t{position:absolute;left:0;right:0;bottom:0;padding:22cqw 8cqw 8cqw;background:linear-gradient(180deg,transparent,rgba(0,0,0,.78) 55%);display:flex;flex-direction:column;gap:1.5cqw}
.cv-t b{font-family:"Lora",Georgia,serif;font-size:max(8px,11.5cqw);font-weight:700;line-height:1.12;text-wrap:balance;overflow-wrap:anywhere;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.cv-t em{font-style:normal;font-size:max(6px,7cqw);font-weight:600;opacity:.82}
.cover .au{position:absolute;top:2.5cqw;right:2.5cqw;z-index:2;width:14cqw;height:14cqw;min-width:16px;min-height:16px;border-radius:50%;background:rgba(0,0,0,.45);display:grid;place-items:center}
.cover .au svg{width:55%;height:55%}

/* library list */
.title{font-size:30px;font-weight:800;letter-spacing:-.5px}
.row{display:flex;align-items:center;gap:14px}
.row .round{width:48px;height:48px}
.rows{display:flex;flex-direction:column}
.rows .row{padding:14px 0;border-bottom:1px solid var(--line)}
.rows .row:last-child{border:0}
.rows .txt{flex:1;min-width:0}
.rows .txt b{font-size:17px;font-weight:800;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rows .txt span{color:var(--muted);font-weight:700;font-size:16px}
.prem{display:inline-flex;align-items:center;gap:4px;background:var(--orange-soft);color:var(--orange);border-radius:12px;padding:3px 9px;font-size:11.5px;font-weight:800;letter-spacing:.3px}
.prem svg{width:14px;height:14px}
.chev{width:20px;height:20px;color:var(--muted);flex:none}

/* profile */
.screen>.pcover{padding-top:0}
.pcover{height:150px;background:linear-gradient(180deg,var(--indigo),var(--indigo-2));position:relative;margin-bottom:-52px}
.pcover .round{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(env(safe-area-inset-top,0px) + 16px);background:rgba(20,22,70,.75);color:#fff;border-radius:14px}
.prow{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.av{width:104px;height:104px;border-radius:50%;border:4px solid var(--bg);background:linear-gradient(140deg,#2f4a63,#162636);display:grid;place-items:center;color:#fff;font-size:42px;font-weight:800}
.prow .btns{display:flex;gap:10px}
.prow .pill{height:46px}
.name{font-size:24px;font-weight:800;line-height:1.15}
.sub{color:var(--muted);font-weight:700;font-size:17px;margin-top:6px}
.meta2{display:flex;gap:18px;flex-wrap:wrap;color:var(--muted);font-weight:700;margin-top:10px}
.meta2 span{display:flex;gap:7px;align-items:center}
.meta2 svg{width:22px;height:22px}
.banner2{border-radius:22px;padding:18px;background:linear-gradient(110deg,var(--orange-3),var(--orange-2));color:#fff;display:flex;align-items:center;gap:14px}
.banner2 div{flex:1;min-width:0}
.banner2 b{font-size:20px;font-weight:800;display:block}
.banner2 span{font-weight:600;font-size:14px;line-height:1.3;display:block}
.banner2 .cta{border:1.5px solid rgba(255,255,255,.7);background:transparent;color:#fff;border-radius:22px;height:42px;padding:0 14px;font-weight:700;flex:none}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--card);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.stat small{color:var(--muted);font-weight:700;font-size:15px}
.stat b{font-size:24px;font-weight:800;display:flex;align-items:center;gap:8px;font-variant-numeric:tabular-nums}
.dot{width:24px;height:24px;border-radius:50%;display:inline-grid;place-items:center;font-size:12px;font-weight:800;flex:none}
.tabs-in-p{display:flex;gap:6px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs-in-p button{background:none;border:0;padding:12px 14px;font-weight:700;font-size:17px;color:var(--muted);border-bottom:3px solid transparent;flex:none}
.tabs-in-p button.on{color:var(--ink);border-color:var(--orange);font-weight:800}
.thought{display:flex;gap:12px;align-items:center}
.thought .sm{width:46px;height:46px;border-radius:50%;background:linear-gradient(140deg,#2f4a63,#162636);color:#fff;display:grid;place-items:center;font-weight:800;flex:none}
.thought b{display:block;font-size:17px}
.thought span{color:var(--muted);font-weight:700;font-size:17px}

.empty-card{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:14px}
.empty-card>div{flex:1;min-width:0}.empty-card b{display:block;font-size:16px;font-weight:800}.empty-card span:not(.round):not(.gart){display:block;color:var(--muted);font-weight:600;font-size:13.5px;margin-top:2px}
.empty-card .pill{height:38px;padding:0 14px;background:var(--orange);color:#fff;flex:none}
.plan{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:20px;padding:14px}
.plan>div{flex:1;min-width:0}.plan b{display:block;font-size:16px;font-weight:800}.plan span:not(.round):not(.gart){display:block;color:var(--muted);font-weight:600;font-size:13px}
.plan .pill{height:38px;padding:0 14px;flex:none;background:var(--bg)}
.catlist{display:flex;flex-direction:column;gap:12px}
.catrow{display:flex;align-items:center;gap:14px;background:var(--card);border:0;border-radius:22px;padding:14px;text-align:left;width:100%}
.cico{width:54px;height:54px;border-radius:17px;background:linear-gradient(140deg,var(--orange-3),var(--orange-2));color:#fff;display:grid;place-items:center;flex:none}
.cico .ico{width:28px;height:28px}
.catrow .txt{flex:1;min-width:0;display:flex;flex-direction:column}
.catrow b{font-size:17px;font-weight:800}.catrow .txt span{color:var(--muted);font-weight:600;font-size:13px}
.catrow .num{color:var(--orange);font-weight:800;background:var(--orange-soft);border-radius:12px;padding:3px 10px;font-size:13px}
.gopts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gopt{display:flex;flex-direction:column;align-items:center;gap:12px;background:var(--card);border:2px solid transparent;border-radius:24px;padding:24px 10px;font-weight:800;font-size:18px}
.gopt:active,.gopt:focus-visible{border-color:var(--orange)}
.gi{width:74px;height:74px;border-radius:50%;background:linear-gradient(140deg,var(--orange-3),var(--orange-2));color:#fff;display:grid;place-items:center}
.gi .ico{width:40px;height:40px}
.rows .txt b{display:block}
.gart{width:92px;height:92px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff,var(--orange-soft));display:grid;place-items:center;flex:none}
.gart svg{width:80%;height:80%}
.gart.sm{width:62px;height:62px}
.screen.home{gap:14px}
.promo.hp{height:128px;min-height:0;padding:14px 16px;justify-content:center}
.promo.hp h2{font-size:19px}.promo.hp .cta{margin-top:6px;height:38px;font-size:14px}
.wheel{position:relative;flex:none;height:178px;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none;overscroll-behavior:contain;-webkit-mask-image:linear-gradient(transparent 0,#000 24%,#000 76%,transparent 100%);mask-image:linear-gradient(transparent 0,#000 24%,#000 76%,transparent 100%)}
.wheel::-webkit-scrollbar{display:none}
.witem{height:118px;display:flex;gap:14px;align-items:center;scroll-snap-align:center;padding:10px 12px;border-radius:24px;transition:background .15s}
.witem.focus{background:var(--card)}
.wi{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.wi b{font-size:16.5px;font-weight:800;line-height:1.2}.wi .a{color:var(--muted);font-weight:600;font-size:13px}
.readbtn{display:none;align-items:center;justify-content:center;gap:8px;height:42px;border:0;border-radius:16px;padding:0 14px;font-weight:800;font-size:15px;color:#fff;background:linear-gradient(135deg,#0aa86a,#7be08f);box-shadow:0 8px 20px rgba(19,165,109,.45);margin-top:2px}
.readbtn small{font-weight:700;opacity:.85;font-size:12.5px}.readbtn .ico{width:18px;height:18px}
.witem.focus .readbtn{display:inline-flex}
@media (prefers-reduced-motion:no-preference){.witem.focus .readbtn{animation:glow 2.2s ease-in-out infinite}@keyframes glow{50%{box-shadow:0 10px 26px rgba(19,165,109,.7)}}}
.bd{padding-bottom:calc(30px + env(safe-area-inset-bottom,0px))}
.bd-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:4;display:flex;align-items:center;gap:8px;padding-block:10px;background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 85%,#000),transparent)}
.bd-ic{width:42px;height:42px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;display:grid;place-items:center;flex:none}
.bd-ic .ico{width:21px;height:21px}
.bd-tt{flex:1;min-width:0;color:#fff;font-weight:800;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.9}
.bd-hero{margin-top:-62px;padding-top:70px;padding-bottom:18px;text-align:center;background:linear-gradient(180deg,color-mix(in srgb,var(--bc) 85%,#000) 0,color-mix(in srgb,var(--bc) 35%,var(--bg)) 55%,var(--bg) 100%);display:flex;flex-direction:column;align-items:center;gap:8px}
.bd-cover{width:min(56vw,220px)}.bd-cover .cover{box-shadow:0 18px 40px rgba(0,0,0,.45)}
.bd-hero h1{font-size:26px;font-weight:800;margin-top:12px;text-wrap:balance}
.bd-au{color:var(--muted);font-weight:600;font-size:17px}
.bd-body{display:flex;flex-direction:column;gap:22px}
.bd-stats{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:22px;padding:14px 4px}
.bd-stats>div{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}.bd-stats>div+div{border-left:1px solid var(--line)}
.bd-stats small{color:var(--muted);font-weight:700;font-size:13.5px}
.bd-stats b{display:flex;align-items:center;gap:6px;font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
.bd-stats .ico{width:20px;height:20px}
.bd-act{display:flex;align-items:stretch;border-radius:22px;overflow:hidden;background:linear-gradient(135deg,#0aa86a,#5fd394);box-shadow:0 10px 24px rgba(19,165,109,.35)}
.bd-act i{width:1px;background:rgba(255,255,255,.35);margin:12px 0}
.bd-btn{flex:1;height:58px;border:0;background:transparent;color:#fff;font-weight:800;font-size:17px;display:flex;align-items:center;justify-content:center;gap:9px}
.bd-btn small{font-weight:700;opacity:.85;font-size:13px}.bd-btn .ico{width:22px;height:22px}
.bd-desc{font-size:16px;line-height:1.6;font-weight:500}
.bd-h{font-size:20px;font-weight:800}
.bd-info{background:var(--card);border-radius:22px;padding:4px 16px}
.bd-info>div{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0}.bd-info>div+div{border-top:1px solid var(--line)}
.bd-info span{display:flex;align-items:center;gap:8px;color:var(--muted);font-weight:700}.bd-info .ico{width:20px;height:20px}
.bd-info b{font-weight:700;text-align:right}.bd-info em{font-style:normal;color:var(--orange)}
.bd-info .age{border:1.5px solid var(--ink);border-radius:8px;padding:2px 8px;font-size:14px}
.bd-q,.bd-op{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--card);border-radius:20px;padding:14px 16px;text-align:left;font-weight:700;font-size:15.5px}
.bd-q .qt{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bd-q .sp{color:#9a7bff;display:grid}.bd-q .sp .ico{width:22px;height:22px}
.bd-op .txt{flex:1;min-width:0;display:flex;flex-direction:column}.bd-op .txt span{color:var(--muted);font-weight:600}
.av2{width:46px;height:46px;border-radius:50%;background:var(--orange-soft);color:var(--orange);display:grid;place-items:center;flex:none}
.bd-all{background:none;border:0;color:var(--muted);font-weight:700}
.simb{display:flex;flex-direction:column;gap:10px;width:140px;flex:none}.simb .book{width:100%}
.simr{height:40px;border-radius:20px;border:1.5px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center}.simr .ico{width:20px;height:20px}
/* search */
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 14px;height:50px;flex:1}
.search input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-weight:600}
.empty{color:var(--muted);text-align:center;padding:30px 0;font-weight:600}

/* goal / community placeholders */
.soon{text-align:center;padding:50px 10px;display:flex;flex-direction:column;align-items:center;gap:12px;color:var(--muted);font-weight:600}
.soon h2{color:var(--ink);font-size:22px;font-weight:800}
.soon .big{width:90px;height:90px;border-radius:50%;background:var(--orange-soft);display:grid;place-items:center;color:var(--orange)}
.soon .big svg{width:44px;height:44px}

/* login */
.login{min-height:100%;display:flex;flex-direction:column;gap:18px;padding-bottom:30px}
.login .hero{background:linear-gradient(140deg,var(--orange-3),var(--orange-2));color:#fff;border-radius:0 0 32px 32px;padding-top:70px;padding-bottom:36px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.login .hero .lg{width:84px;height:84px;border-radius:26px;background:#fff;display:grid;place-items:center;box-shadow:0 8px 20px rgba(0,0,0,.18)}
.login .hero .lg svg{width:62px;height:62px}
.login h1{font-size:32px;font-weight:800;letter-spacing:-.5px}
.login .hero p{font-weight:600;max-width:26ch}
.login h2{font-size:23px;font-weight:800}
.hint{color:var(--muted);font-weight:600;font-size:14px}
.field{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:16px;padding:0 16px;height:56px;border:2px solid transparent}
.field:focus-within{border-color:var(--orange)}
.field .pre{font-weight:800;color:var(--muted)}
.field input{border:0;background:transparent;outline:0;flex:1;min-width:0;font-size:18px;font-weight:700}
.code{display:flex;gap:8px}
.code input{height:56px!important;font-size:22px!important;padding:0}
.btn[disabled]{opacity:.6}
.code input{width:100%;height:62px;text-align:center;font-size:26px;font-weight:800;border-radius:16px;border:2px solid transparent;background:var(--card);outline:0}
.code input:focus{border-color:var(--orange)}
.btn{height:56px;border-radius:18px;border:0;font-weight:800;font-size:17px;background:var(--orange);color:#fff;width:100%}
.btn-t{background:none;border:0;color:var(--orange);font-weight:700;padding:8px}
.demo{display:inline-block;font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:var(--card);color:var(--muted);padding:3px 8px;border-radius:8px}

/* tab bar */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:460px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}

 let g=null;
 v.onpointerdown=e=>{if(RD.busy||S.sheet||e.button>0)return;g={x0:e.clientX,y0:e.clientY,t:performance.now(),dx:0,dir:0,vx:0,lx:e.clientX,lt:performance.now()};try{v.setPointerCapture(e.pointerId)}catch(_){}};

function bind(){

 $$("[data-sheet]",b=>b.onclick=e=>{e.stopPropagation();S.sheet=b.dataset.sheet;if(S.sheet==="toc")S.tocTab=0;render()});
 $$("[data-shclose]",b=>b.onclick=closeSheet);
 $$("[data-toct]",b=>b.onclick=()=>{S.tocTab=+b.dataset.toct;render()});
 const jump=p=>{const id=S.rdId;if(locked(bk(id))&&p>=FREE_PAGES){S.payId=id;S.sheet="pay";render();return}S.pages[id]=p;S.sheet=null;render()};
 $$("[data-goch]",b=>b.onclick=()=>jump(RD?RD.heads[+b.dataset.goch]:0));
 $$("[data-gopg]",b=>b.onclick=()=>jump(+b.dataset.gopg));
 $$("[data-fs]",b=>b.onclick=()=>{S.pref.fs=Math.max(14,Math.min(28,S.pref.fs+ +b.dataset.fs));render()});
 $$("[data-theme-set]",b=>b.onclick=()=>{const k=b.dataset.themeSet;if(k===(S.theme||"auto"))return;
  nav(()=>{S.theme=k;S.pref.th=k==="paper"?"sepia":k==="dark"?"dark":k==="light"?"white":(matchMedia("(prefers-color-scheme: dark)").matches?"dark":"white");applyTheme();render()},"fade")});
 $$("[data-th]",b=>b.onclick=()=>{S.pref.th=b.dataset.th;render()});
 $$("[data-ff]",b=>b.onclick=()=>{S.pref.ff=b.dataset.ff;render()});
 $$("[data-subscribe]",b=>b.onclick=()=>{S.premium=true;S.sheet=null;toast("Намуна: Премиум фаъол шуд");render()});
 $$("[data-paywall]",b=>b.onclick=()=>{S.payId=null;S.sheet="pay";render()});
 $$("[data-dlbook]",b=>b.onclick=()=>{const id=+b.dataset.dlbook;if(locked(bk(id))){S.payId=id;S.sheet="pay";render();return}S.dlBook[id]=!S.dlBook[id];toast(S.dlBook[id]?"Барои хондан бе интернет нигоҳ дошта шуд":"Аз хотираи телефон тоза шуд");render()});
 $$("[data-applay]",b=>b.onclick=()=>{const a=S.au;if(locked(bk(a.id))&&a.pos>=FREE_SEC){S.payId=a.id;S.sheet="pay";render();return}a.playing=!a.playing;render()});
 $$("[data-apspeed]",b=>b.onclick=()=>{const L=[1,1.25,1.5,2,0.75];S.au.speed=L[(L.indexOf(S.au.speed)+1)%L.length];render()});
 $$("[data-apskip]",b=>b.onclick=()=>{const a=S.au,t=tracks(bk(a.id))[a.ch];let p=a.pos+ +b.dataset.apskip;if(locked(bk(a.id)))p=Math.min(p,FREE_SEC);a.pos=Math.max(0,Math.min(t.d,p));aprog();tickUI()});
 $$("[data-aptimer]",b=>b.onclick=()=>{const L=[0,900,1800,3600],a=S.au;a.sleepSet=L[(L.indexOf(a.sleepSet||0)+1)%L.length];a.sleep=a.sleepSet;toast(a.sleep?`Таймер: пас аз ${a.sleep/60} дақиқа қатъ мешавад`:"Таймер хомӯш");render()});
 $$("[data-goat]",b=>b.onclick=()=>{const a=S.au;a.ch=+b.dataset.goat;a.pos=0;a.playing=true;S.sheet=null;render()});
 $$("[data-dlt]",b=>b.onclick=()=>dl([+b.dataset.dlt]));
 $$("[data-dlall]",b=>b.onclick=()=>dl(tracks(bk(S.au.id)).map((_,i)=>i)));
 $$("[data-openap]",b=>b.onclick=()=>nav(()=>{S.apPrev=S.view;S.view="audio";render();window.scrollTo(0,0)},"up"));
 $$("[data-apmin]",b=>b.onclick=()=>nav(()=>{S.view=S.apPrev||"home";S.sheet=null;render();window.scrollTo(0,0)},"down"));
 $$("[data-mpclose]",b=>b.onclick=()=>{S.apos[S.au.id]={ch:S.au.ch,pos:S.au.pos};S.au=null;render()});
 $$("[data-author]",b=>b.onclick=()=>{S.q=b.dataset.author;S.chip="all";openSearch()});
 const sk=document.getElementById("apseek");if(sk){sk.oninput=()=>{sk.dataset.drag=1;const a=S.au;let p=+sk.value;if(locked(bk(a.id))&&p>FREE_SEC){p=FREE_SEC;sk.value=p}a.pos=p;aprog();tickUI()};sk.onchange=()=>{delete sk.dataset.drag}}
 const mk=document.getElementById("rdmark");if(mk)mk.onclick=()=>{const id=S.rdId,p=S.pages[id]||0,a=S.marks[id]||[],had=a.includes(p);S.marks[id]=had?a.filter(x=>x!==p):[...a,p];mk.classList.toggle("on",!had);toast(had?"Хатчӯб бардошта шуд":"Хатчӯб гузошта шуд");save()};
 setupReader();
 setupSheet();
 setupWheel();
 $$("[data-opensearch]",b=>b.onclick=()=>{S.q="";S.chip="all";openSearch()});
 $$("[data-closesearch]",b=>b.onclick=()=>{S.search=false;S.q="";S.chip="all";render()});
 $$("[data-cat]",b=>b.onclick=()=>{S.view="home";S.search=true;S.chip=b.dataset.cat;S.q="";render(true)});
 $$("[data-chip]",b=>b.onclick=()=>{S.chip=b.dataset.chip;render()});
 $$("[data-chip2]",b=>b.onclick=()=>{S.chip=b.dataset.chip2;S.q="";openSearch()});
 $$("[data-ptab]",b=>b.onclick=()=>{S.ptab=+b.dataset.ptab;render()});
 const q=document.getElementById("q");if(q)q.oninput=()=>{S.q=q.value;render(true)};
 const send=document.getElementById("send");
 if(send)send.onclick=async()=>{const e=document.getElementById("email").value.trim().toLowerCase();
  if(!okMail(e)){toast("Почтаро дуруст нависед, масалан nom@gmail.com");return}
  S.email=e;send.disabled=true;send.textContent="Фиристода истодааст…";
  const c=await sbLoad();
  if(c){const{error}=await c.auth.signInWithOtp({email:e,options:{shouldCreateUser:true}});
   if(error){send.disabled=false;send.textContent="Гирифтани рамз";toast(/rate|limit|seconds/i.test(error.message)?"Каме сабр кунед ва аз нав кӯшиш кунед":"Хато: "+error.message);return}}
  else if(SB_URL){send.disabled=false;send.textContent="Гирифтани рамз";toast("Интернет нест ё сервер ҷавоб намедиҳад");return}
  S.step="code";render();document.getElementById("c0").focus()};
 const cs=[0,1,2,3,4,5].map(i=>document.getElementById("c"+i));
 if(cs[0])cs.forEach((c,i)=>{c.oninput=()=>{let v=c.value.replace(/\D/g,"");
   if(v.length>1){v.split("").slice(0,6-i).forEach((d,j)=>cs[i+j].value=d);(cs[Math.min(i+v.length,5)]).focus();return}
   c.value=v;if(v&&cs[i+1])cs[i+1].focus()};c.onkeydown=e=>{if(e.key==="Backspace"&&!c.value&&cs[i-1])cs[i-1].focus()}});
 const ver=document.getElementById("verify");if(ver)ver.onclick=async()=>{const t=cs.map(c=>c.value).join("");
  if(t.length!==6){toast("Ҳар 6 рақамро нависед");return}
  ver.disabled=true;ver.textContent="Тафтиш…";
  const c=await sbLoad();
  if(c){const{data,error}=await c.auth.verifyOtp({email:S.email,token:t,type:"email"});
   if(error){ver.disabled=false;ver.textContent="Тасдиқ кардан";toast("Рамз нодуруст ё кӯҳна аст");return}
   const m=data.user?.user_metadata||{};S.uid=data.user?.id||"";
   if(m.gender){S.gender=m.gender;S.uname=m.name||"";S.step="email";go("home");return}}
  S.step="gender";render()};
 $$("[data-g]",b=>b.onclick=async()=>{const n=(document.getElementById("uname").value||"").trim();
  if(!n){toast("Номатонро нависед");return}
  S.gender=b.dataset.g;S.uname=n;
  const c=await sbLoad();if(c){const{error}=await c.auth.updateUser({data:{gender:S.gender,name:n}});if(error)toast("Дар сервер сабт нашуд, баъдтар аз нав")}
  S.step="email";go("home")});
 const back=document.getElementById("back");if(back)back.onclick=()=>{S.step="email";render()};
}
const h=location.hash.slice(1);if(["login","home","lib","goal","comm","me"].includes(h))S.view=h;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.sheet){closeSheet();return}
 if(S.view==="read"&&!S.sheet&&!/INPUT|TEXTAREA/.test(document.activeElement.tagName)){if(e.key==="ArrowRight")turn(1);if(e.key==="ArrowLeft")turn(-1)}});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(S.view==="read")setupReader();TB.iw=0;if(!TB.raf){const i=tabKeys().indexOf(S.view);if(i>=0){tbMeasure();TB.x=TB.tx=tbCenter(i);tbDraw()}}},150)});
if(S.step==="phone")S.step="email";
sbLoad().then(async c=>{if(!c)return;const{data}=await c.auth.getSession();const u=data.session?.user;
 if(u){const m=u.user_metadata||{};S.uid=u.id;S.email=u.email||S.email;if(m.gender){S.gender=m.gender;S.uname=m.name||S.uname;if(S.view==="login"){go("home")}}else if(S.view==="login"){S.step="gender";render()}}
 else if(S.gender&&S.uid){S.gender=undefined;S.uid="";S.view="login";S.step="email";render()}});
applyTheme();matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change",applyTheme);
render();
</script>

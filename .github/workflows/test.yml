name: Санҷиши феатурҳо

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: "index.html бо src/ мувофиқ аст?"
        run: python3 tools/build.py --check
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: "Playwright"
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: "Санҷиши ҳар феатур"
        run: node tests/run.js
      - name: "Тафтиши фарогир (ҳамаи саҳифаҳо ва варақҳо)"
        run: node tests/crawl.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: "Санҷиши нақшаи эслатмаҳо (Java)"
        run: |
          mkdir -p /tmp/rp
          javac -encoding UTF-8 -d /tmp/rp apk/src/src/tj/kitobkhona/app/RemindPlan.java tests/RemindPlanTest.java
          java -cp /tmp/rp tj.kitobkhona.app.RemindPlanTest

  # SQL (docs/sql-*.sql) дар PostgreSQL-и вақтинчаи CI бо Supabase-тақлид; ба Supabase-и воқеӣ дахл надорад
  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - name: "SQL: тартиб, такрор ва синовҳои RLS"
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci
        run: tests/run-sql.sh

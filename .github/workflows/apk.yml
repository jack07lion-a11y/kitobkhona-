name: APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: "Калити санҷишӣ (кэш, имзои ягона барои навсозӣ)"
        uses: actions/cache@v4
        with:
          path: apk/ks
          key: kitob-ks-v1
      - name: Йиғиш
        env:
          VC: ${{ github.run_number }}
          VN: "0.1-test.${{ github.run_number }}"
        run: ./apk/build-ci.sh
      - name: "Нигоҳ доштан (Artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: kitobkhona-apk
          path: apk/src/build/kitobkhona.apk
      - name: "Release (пинҳон, танҳо барои шумо)"
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp apk/src/build/kitobkhona.apk kitobkhona-$N.apk
          zip -q kitobkhona-$N.zip kitobkhona-$N.apk
          gh release create "apk-$N" kitobkhona-$N.apk kitobkhona-$N.zip \
            --draft --prerelease --title "Китобхона APK #${{ github.run_number }}" \
            --notes "Санҷишӣ APK. Китоб: Ёддоштҳо. Нусха ${{ github.sha }}"
      - name: "Release (ҷамъиятӣ: барои навсозии дӯстон, фақат дастӣ аз main)"
        if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp apk/src/build/kitobkhona.apk kitobkhona.apk
          gh release create "apk-$N" kitobkhona.apk --latest \
            --title "Китобхона APK #$N" \
            --notes "Версияи нави барнома. APK-ро боргирӣ ва насб кунед."

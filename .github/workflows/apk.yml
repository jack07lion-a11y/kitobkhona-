name: APK

on:
  push:
    branches: [main, "claude/apk"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Калити санҷишӣ (кэш: ҳамон имзо барои навсозӣ)
        uses: actions/cache@v4
        with:
          path: apk/ks
          key: kitob-ks-v1
      - name: Йиғиш
        env:
          VC: ${{ github.run_number }}
          VN: "0.1-test.${{ github.run_number }}"
        run: ./apk/build-ci.sh
      - name: Нигоҳ доштан (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: kitobkhona-apk
          path: apk/src/build/kitobkhona.apk
      - name: Лоиҳаи Release (танҳо барои шумо, пинҳон)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apk/src/build/kitobkhona.apk kitobkhona-${{ github.run_number }}.apk
          gh release create "apk-${{ github.run_number }}" kitobkhona-${{ github.run_number }}.apk \
            --draft --prerelease --title "Китобхона APK #${{ github.run_number }}" \
            --notes "Санҷишӣ APK. Дар ин китоб: Ёддоштҳо (Садриддин Айнӣ). Нусха: ${{ github.sha }}"

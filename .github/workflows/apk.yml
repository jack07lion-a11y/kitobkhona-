name: APK

on:
  push:
    branches: [main, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: "Калити кӯҳнаи санҷишӣ (кэш; фақат то он ки apk/ks.enc пайдо шавад)"
        if: hashFiles('apk/ks.enc') == ''
        uses: actions/cache@v4
        with:
          path: apk/ks
          key: kitob-ks-v1
      - name: "Калити асосӣ (аз apk/ks.enc бо парол KS_PASS)"
        if: hashFiles('apk/ks.enc') != ''
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          [ -n "$KS_PASS" ] || { echo "KS_PASS дар Secrets нест"; exit 1; }
          mkdir -p apk/ks
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in apk/ks.enc -out apk/ks/kitobkhona.jks -pass env:KS_PASS
      - name: Йиғиш
        env:
          VC: ${{ github.run_number }}
          VN: "0.1-test.${{ github.run_number }}"
          KS_PASS: ${{ secrets.KS_PASS }}
        run: ./apk/build-ci.sh
      - name: "Нигоҳ доштан (Artifact)"
        uses: actions/upload-artifact@v4
        with:
          name: kitobkhona-apk
          path: apk/src/build/kitobkhona.apk
      - name: "Release (пинҳон, танҳо барои шумо)"
        if: github.ref != 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp apk/src/build/kitobkhona.apk kitobkhona-$N.apk
          zip -q kitobkhona-$N.zip kitobkhona-$N.apk
          gh release create "apk-$N" kitobkhona-$N.apk kitobkhona-$N.zip \
            --draft --prerelease --title "Китобхона APK #${{ github.run_number }}" \
            --notes "Санҷишӣ APK. Китоб: Ёддоштҳо. Нусха ${{ github.sha }}"
      - name: "Release (номзад: админ дар барнома «Нашр кардан»-ро пахш мекунад)"
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp apk/src/build/kitobkhona.apk kitobkhona.apk
          gh release create "apk-$N" kitobkhona.apk --prerelease \
            --title "Китобхона APK #$N" \
            --notes "Номзад. Ба корбарон танҳо баъди «Нашр кардан» дар барнома мерасад."

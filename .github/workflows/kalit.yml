name: "Калит (як маротиба)"

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Сохтани калити нав
        env:
          KS_PASS: ${{ secrets.KS_PASS }}
        run: |
          [ ! -f apk/ks.enc ] || { echo "Калит аллақачон ҳаст (apk/ks.enc). Аз нав сохтан имзоро иваз мекунад, ва ҳамаи APK-ҳо аз нав насб мешаванд. Аввал файлро ба таври қасдан нест кунед."; exit 1; }
          [ -n "$KS_PASS" ] || { echo "KS_PASS дар Secrets нест"; exit 1; }
          [ ${#KS_PASS} -ge 20 ] || { echo "Парол бояд камаш 20 ҳарф бошад"; exit 1; }
          keytool -genkeypair -keystore ks.jks -storepass "$KS_PASS" -keypass "$KS_PASS" -alias kitobkhona -keyalg RSA -keysize 4096 -validity 36500 -dname "CN=Kitobkhona, O=Kitobkhona, C=TJ"
          openssl enc -aes-256-cbc -pbkdf2 -iter 600000 -salt -in ks.jks -out apk/ks.enc -pass env:KS_PASS
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -in apk/ks.enc -out back.jks -pass env:KS_PASS
          cmp ks.jks back.jks
          rm -f ks.jks back.jks
      - name: Нигоҳ доштан дар репозиторий (рамзгузоришуда)
        run: |
          git config user.name "kitobkhona-bot"
          git config user.email "bot@users.noreply.github.com"
          git add apk/ks.enc
          git commit -m "Калити имзо (рамзгузоришуда, парол: GitHub Secret KS_PASS)"
          git push
